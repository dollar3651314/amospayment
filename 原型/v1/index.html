<style>
/* 布局：电脑 = 左侧栏 + 顶栏 + 内容区（框架宽度固定，页面只改内容区，C90）；手机 = 顶栏 + 底部标签栏，一屏一件事（C64） */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --sunk: #f7f9fb; --ink: #17212b; --muted: #5d6875; --faint: #8a94a0;
  --line: #dde2e8; --accent: #1f5f8b; --accent-ink: #ffffff; --accent-soft: #e4eef6;
  --copper: #b05f1e; --copper-soft: #f8ece1;
  --ok: #2c7a4a; --ok-soft: #e3f2e8; --warn: #946c0b; --warn-soft: #f8f0d6; --bad: #b4322a; --bad-soft: #fbe6e4;
  --side: #16212c; --side-ink: #c9d3dd; --side-active: #253445;
  --proto: #6b3fa0; --proto-soft: #efe7f8;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #172029; --sunk: #131b23; --ink: #e4e9ee; --muted: #9aa6b2; --faint: #6f7b88;
    --line: #2a3542; --accent: #6aaedb; --accent-ink: #0f141a; --accent-soft: #1a2c3b;
    --copper: #e09a5e; --copper-soft: #382818;
    --ok: #67c08a; --ok-soft: #173023; --warn: #d8b552; --warn-soft: #332a12; --bad: #ef7d74; --bad-soft: #3a1c1a;
    --side: #0b1015; --side-ink: #aab6c2; --side-active: #1b2733; --proto: #b38be0; --proto-soft: #2a2036; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #172029; --sunk: #131b23; --ink: #e4e9ee; --muted: #9aa6b2; --faint: #6f7b88;
  --line: #2a3542; --accent: #6aaedb; --accent-ink: #0f141a; --accent-soft: #1a2c3b;
  --copper: #e09a5e; --copper-soft: #382818;
  --ok: #67c08a; --ok-soft: #173023; --warn: #d8b552; --warn-soft: #332a12; --bad: #ef7d74; --bad-soft: #3a1c1a;
  --side: #0b1015; --side-ink: #aab6c2; --side-active: #1b2733; --proto: #b38be0; --proto-soft: #2a2036; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.35; text-wrap: balance; }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
p { margin: 0; }

/* 原型标识 */
.protobar { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; background: var(--proto); color: #fff; font-size: 12px; text-align: center; padding: 3px 12px calc(3px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }

/* 电脑框架 */
.app { display: grid; grid-template-columns: 224px 1fr; min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); padding: 16px 12px 40px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { color: #fff; font-weight: 700; font-size: 16px; padding: 4px 10px 14px; display: flex; gap: 8px; align-items: center; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--copper); display: inline-block; }
.side .grp { font-size: 11px; letter-spacing: .1em; color: #7d8a97; padding: 12px 10px 4px; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--side-ink); }
.nav:hover { background: var(--side-active); text-decoration: none; }
.nav.on { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--copper); }
.cnt { font-family: var(--f-mono); font-size: 11px; background: var(--copper); color: #fff; border-radius: 999px; padding: 0 7px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.switcher { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.switcher button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
.switcher button.on { background: var(--accent); color: var(--accent-ink); }
.envtag { font-size: 12px; background: var(--proto-soft); color: var(--proto); padding: 2px 8px; border-radius: 4px; font-weight: 700; }
.top .sp { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.who select, .langsel { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 6px; }
.content { padding: 24px 24px 64px; display: grid; gap: 20px; align-content: start; }
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.phead p { color: var(--muted); font-size: 13px; }

/* 手机框架 */
.mapp { min-height: 100%; display: flex; flex-direction: column; padding-bottom: 84px; }
.mtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); height: 52px; display: flex; align-items: center; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.mtop .ttl { flex: 1; font-weight: 700; font-size: 16px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtop .ic { width: 64px; display: flex; align-items: center; }
.mtop .ic.r { justify-content: flex-end; }
.mcontent { padding: 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 22px; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 7px 0 6px; font-size: 11px; color: var(--muted); position: relative; }
.tabbar a:hover { text-decoration: none; }
.tabbar a.on { color: var(--accent); font-weight: 700; }
.tabbar svg { width: 20px; height: 20px; }
.tabbar .cnt { position: absolute; top: 2px; left: 56%; }

/* 通用组件 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card.flat { padding: 0; overflow: hidden; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.sb { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .faint { color: var(--faint); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13.5px; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: var(--accent); text-decoration: none; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.cop { background: var(--copper); border-color: var(--copper); color: #fff; font-weight: 500; }
.btn.bad { color: var(--bad); border-color: var(--bad-soft); }
.btn.sm { padding: 3px 10px; font-size: 12.5px; }
.btn.block { width: 100%; padding: 11px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.cop { background: var(--copper-soft); color: var(--copper); }
.pill.gray { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; background: var(--sunk); }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12.5px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 10px; width: 100%; }
.field .hint { font-size: 12px; color: var(--faint); }
.field .err { font-size: 12px; color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.note { font-size: 12.5px; padding: 8px 12px; border-radius: 7px; background: var(--sunk); border: 1px solid var(--line); color: var(--muted); }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.note.cop { background: var(--copper-soft); border-color: transparent; color: var(--copper); }
.note.proto { background: var(--proto-soft); border-color: transparent; color: var(--proto); }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--ink); }

/* 余额 */
.bal3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bal3 div { display: grid; }
.bal3 small { color: var(--muted); font-size: 11.5px; }
.bal3 b { font-family: var(--f-mono); font-weight: 500; font-size: 14px; }
.bal3 .av b { color: var(--accent); }
.asset { display: flex; align-items: center; gap: 8px; }
.coin { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.coin.usdt { background: #26a17b; } .coin.usdc { background: #2775ca; }
.chain { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.big { font-family: var(--f-mono); font-size: 26px; font-weight: 500; letter-spacing: -.01em; }

/* 时间线 */
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; position: relative; padding-bottom: 14px; }
.tl li::before { content: ""; position: absolute; left: 8px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.tl li:last-child::before { display: none; }
.tl .d { width: 12px; height: 12px; border-radius: 50%; margin: 4px 0 0 3px; background: var(--line); }
.tl li.done .d { background: var(--ok); }
.tl li.cur .d { background: var(--copper); box-shadow: 0 0 0 4px var(--copper-soft); }
.tl li.fail .d { background: var(--bad); }
.tl .t { font-size: 13px; } .tl .s { font-size: 12px; color: var(--muted); }

/* 步骤条 */
.stepper { display: flex; gap: 6px; }
.stepper span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.stepper span.on { background: var(--accent); }

/* 渠道选择 */
.chopt { display: grid; grid-template-columns: 22px 1.4fr 1fr 1fr 1fr 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 13px; }
.chopt.sel { border-color: var(--accent); background: var(--accent-soft); }
.chopt.dis { opacity: .55; cursor: not-allowed; }
.chopt small { display: block; color: var(--muted); font-size: 11.5px; }

/* 弹窗、底部面板、提示 */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 22, .45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: min(440px, 100%); max-height: 90vh; overflow-y: auto; padding: 20px; display: grid; gap: 14px; }
.scrim.sheet { place-items: end stretch; padding: 0; }
.scrim.sheet .modal { width: 100%; border-radius: 14px 14px 0 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; }
.otp { display: flex; gap: 8px; justify-content: center; }
.otp input { width: 42px; height: 48px; text-align: center; font-family: var(--f-mono); font-size: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.toast { position: fixed; z-index: 70; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px); }

/* 手机卡片列表 */
.mlist { display: grid; gap: 10px; }
.mitem { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; color: var(--ink); }
.mitem:hover { text-decoration: none; border-color: var(--accent); }
.mitem .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.mitem .l1 b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mitem .l2 { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.mactions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mactions a { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; }
.mactions a:hover { text-decoration: none; border-color: var(--accent); }
.mactions svg { width: 22px; height: 22px; color: var(--accent); }
.stick { position: sticky; bottom: 84px; background: var(--bg); padding-top: 8px; }

/* 入口页 */
.start { max-width: 980px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
.start .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.plist { display: grid; gap: 4px; font-size: 13px; }
.plist a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }

/* 引导 */
.guide { display: grid; gap: 14px; }
.guide .gstep { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.guide .gstep i { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-style: normal; font-family: var(--f-mono); }

@media (max-width: 1100px) { .grid4 { grid-template-columns: repeat(2, 1fr); } .grid3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .grid2, .grid3, .start .two { grid-template-columns: 1fr; } .kv { grid-template-columns: 96px 1fr; } .chopt { grid-template-columns: 22px 1fr 1fr; } .chopt .hm { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

function mTimeline(o) {
  if (BLOG[o.id]) return BLOG[o.id];
  const st = o.status;
  const steps = [['done', `${MUSERS[o.maker]?.name || '提交人'} 新建付款单`, o.created]];
  const order = ['m_approval', 'compliance', 'channel', 'payout_approval', 'signing', 'processing', 'done'];
  const idx = order.indexOf(st);
  const add = (i, t) => steps.push([idx > i ? 'done' : idx === i ? 'cur' : '', t, '']);
  add(0, '商户内部审批'); add(1, '平台合规审核');
  if (!isCrypto(o)) add(2, '平台选择渠道、锁定报价');
  add(3, '平台出款审批'); add(4, '托管服务商签名、上链'); if (!isCrypto(o)) add(5, '渠道付款'); add(6, '完成');
  if (st === 'rejected' || st === 'cancelled') steps.push(['fail', st === 'rejected' ? '审批人驳回' : '已作废', '']);
  return steps;
}
function tlHtml(steps) { return `<ol class="tl">${steps.map(([c, t, s]) => `<li class="${c}"><span class="d"></span><div><div class="t">${esc(t)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div></li>`).join('')}</ol>`; }

}

// 新建付款（电脑一屏看全；手机分三步）
function draft() {
  if (!S.draft) S.draft = { bene: '', amt: '', pay: 'USDT·TRON', purpose: '', file: false, errs: {} };
  return S.draft;
}
function draftQuote(d) {
  const b = bene(d.bene); const amt = parseFloat(String(d.amt).replace(/,/g, ''));
  if (!b || !(amt > 0)) return null;
  return Object.assign({ amt, cur: b.cur, pay: d.pay }, quoteFor(b.cur, amt, d.pay));
}
function validate(d) {
  const e = {}; const b = bene(d.bene); const q = draftQuote(d);
  if (!b) e.bene = '请选择收款方';
  if (!(parseFloat(String(d.amt).replace(/,/g, '')) > 0)) e.amt = '请输入收款金额';
  if (b && b.type === 'wallet' && !d.pay.startsWith(b.cur)) e.pay = `收款方收 ${b.cur}，请选择 ${b.cur} 的余额，或接受兑换`;
  if (q && q.usdt > avail(d.pay)) e.amt = `可用余额不够：需要 ${fmt(q.usdt)}，可用 ${fmt(avail(d.pay))} ${d.pay}`;
  if (!d.purpose.trim()) e.purpose = '请填写付款用途';
  if (!d.file) e.file = '请上传发票或合同';
  if (S.kyb !== 'ok' || S.newMerchant) e.kyb = '开户审核通过后才能付款';
  return e;
}
function mNew() {

// ---------- 入口页 ----------
function start() {
  const mp = [['m-home', '总览'], ['m-new', '新建付款'], ['m-payouts', '付款记录'], ['m-po.PO-24121', '付款单详情（付款中）'], ['m-po.PO-24112', '付款单详情（全部渠道失败）'], ['m-approvals', '待我审批'], ['m-benes', '收款方'], ['m-bene-new', '添加收款方'], ['m-deposit', '充值'], ['m-transfer', '余额互转'], ['m-team', '团队和审批设置'], ['m-onboarding', '开户资料（Gateway 推荐）'], ['m-bulk', '批量付款'], ['m-guide', '新手引导']];

    <div class="two"><div class="card"><div class="row sb"><h2>商户后台</h2><a class="btn pri" href="#m-home">进入</a></div><p class="small muted">商户用户：管理员、提交人、审批人、查看。在右上角切换演示用户。</p><div class="row"><label class="small"><input type="checkbox" id="newm" ${S.newMerchant ? 'checked' : ''}> 新商户（没有余额、没有记录，看空状态和引导）</label></div><div class="plist">${mp.map(([r, t]) => `<a href="#${r}"><span>${t}</span><span class="faint num">#${r}</span></a>`).join('')}</div></div>
    <div class="card"><div class="row sb"><h2>运营后台</h2><a class="btn pri" href="#o-home">进入</a></div><p class="small muted">平台员工：客服、合规、交易员、出款审批、财务、管理员。在右上角切换演示员工。</p><div class="plist">${op.map(([r, t]) => `<a href="#${r}"><span>${t}</span><span class="faint num">#${r}</span></a>`).join('')}</div></div></div>
    <div class="card"><h2>建议这样走一遍</h2><ol class="small" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>商户后台用 何静（提交人）新建一笔 AED 付款，超过 100,000 USDT 会进入"待我审批"</li><li>切换为 孙涛（审批人）批准，输入任意 6 位数字作为动态码</li><li>到运营后台：王敏（合规）审核通过 → 李强（交易员）选渠道 → 赵磊（出款审批）批准</li><li>在付款单上模拟托管签名、渠道失败（换渠道）或成功；回到商户后台看状态和余额变化</li><li>周婷（财务）在"Gateway 清算"发起一笔结算</li></ol></div></div>`;
}
function guide() {
  const steps = [['认识 Payment', '把 USDT / USDC 充值进来，我们帮你付给全球的合作伙伴，可以付法币'], ['完成开户', '从 Gateway 开通的商户，公司资料已经预填，只补几项'], ['添加收款方', '新收款方平台审核一次，之后随时付款'], ['充值，开始付款', '充值到账后新建付款单，大额由你们的审批人批准']];
  const body = `<div class="guide">${steps.map(([t, s], i) => `<div class="gstep"><i>${i + 1}</i><div><b>${t}</b><p class="small muted">${s}</p></div></div>`).join('')}</div><div class="row"><a class="btn pri" href="#m-onboarding">去完成开户</a><a class="btn" href="#m-home">跳过</a></div><p class="small faint">之后可以在"我的"里重新看。</p>`;

}

// ---------- 渲染 ----------
function view() {
  const r = S.route;
  if (r.startsWith('m-po.')) return mPO(r.slice(5));
  if (r.startsWith('o-po.')) return oPO(r.slice(5));
  const V = { start, 'm-home': mHome, 'm-new': mNew, 'm-bulk': () => isM() ? mNew() : mBulk(), 'm-payouts': mPayouts, 'm-approvals': mApprovals, 'm-benes': mBenes, 'm-bene-new': mBeneNew, 'm-deposit': mDeposit, 'm-transfer': mTransfer, 'm-team': mTeam, 'm-onboarding': mOnboarding, 'm-me': () => isM() ? mMe() : mHome(), 'm-guide': guide,
    'o-home': oHome, 'o-orders': oOrders, 'o-exc': oExc, 'o-merchants': oMerchants, 'o-benes': oBenes, 'o-settle': oSettle, 'o-wallets': oWallets, 'o-recon': oRecon, 'o-channels': oChannels, 'o-routes': oRoutes, 'o-pricing': oPricing, 'o-staff': oStaff, 'o-audit': oAudit, 'o-more': () => isM() ? oMore() : oHome() };
  return (V[r] || start)();
}
const root = document.getElementById('root');
function render() {
  root.innerHTML = view() + '<div id="ov"></div>';
  const l = document.getElementById('lang'); if (l) l.value = S.lang;
  renderOverlay();
}
function renderOverlay() {
  const ov = document.getElementById('ov'); if (!ov) return;
  let h = '';
  if (S.modal) {
    const m = S.modal;
    h += `<div class="scrim ${isM() ? 'sheet' : ''}" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(m.title)}</h2>${m.body || ''}${m.otp ? `<p class="small muted">输入动态码（原型：任意 6 位数字）</p><div class="otp">${Array.from({ length: 6 }, (_, i) => `<input id="otp${i}" maxlength="1" inputmode="numeric" aria-label="第 ${i + 1} 位">`).join('')}</div><span class="err small" id="otperr"></span>` : ''}${m.input ? `<div class="field"><label for="mreason">${m.input}</label><textarea id="mreason" rows="3"></textarea></div>` : ''}<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">取消</button><button class="btn ${m.danger ? 'bad' : 'pri'}" data-act="confirm">${esc(m.ok || '确认')}</button></div></div></div>`;
  }
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  ov.innerHTML = h;
  if (S.modal && S.modal.otp && !ov.dataset.f) { const i = document.getElementById('otp0'); i && i.focus(); }
}
function modal(m) { S.modal = m; renderOverlay(); }

// ---------- 操作 ----------
function setStatus(o, st) { o.status = st; }
function act(a, el) {
  const id = el.dataset.id; const o = id && ORDERS.find(x => x.id === id);
  const A = {
    noop: () => toast('原型：这个按钮在开发阶段实现'),
    'to-gateway': () => toast('原型：用一次性登录凭证跳转到 Gateway 商户后台'),
    export: () => toast('原型：导出当前筛选的付款单'), receipt: () => toast('原型：下载 PDF 回单（含渠道回单号）'),
    go: () => go(el.dataset.to),
    copy: () => { try { navigator.clipboard.writeText(el.dataset.v).then(() => toast('已复制地址'), () => toast('复制失败，请手动选中地址')); } catch (e) { toast('复制失败，请手动选中地址'); } },
    'd-file': () => { draft().file = true; render(); },
    'pick-bene': () => { draft().bene = id; render(); },
    mstep: () => { S.mstep = +el.dataset.to; render(); },
    'submit-po': () => {
      const d = draft(); d.errs = validate(d);
      if (Object.keys(d.errs).length) { if (isM()) { const e = d.errs; S.mstep = e.bene ? 1 : (e.amt || e.pay) ? 2 : 3; } render(); toast(`有 ${Object.keys(d.errs).length} 项要改`); return; }
      const q = draftQuote(d); const nid = 'PO-' + (24125 + ORDERS.filter(x => x.id >= 'PO-24125').length);
      const st = q.usdt > S.limit ? 'm_approval' : 'compliance';
      ORDERS.unshift(Object.assign({ id: nid, merchant: 'M-10086', mname: MERCHANT.name, bene: d.bene, purpose: d.purpose, maker: S.mUser, created: '10-23 ' + new Date().toTimeString().slice(0, 5), quoteExp: Date.now() + 15 * MIN, tried: [], status: st }, q));
      S.draft = null; S.mstep = 1; go('m-po.' + nid); toast(st === 'm_approval' ? '已提交，等你们的审批人批准' : '已提交给平台审核，余额已冻结');
    },
    'm-approve': () => {
      if (o.maker === S.mUser) { toast('不能审批自己提交的付款单'); return; }
      modal({ title: `批准 ${o.id}`, body: `<p class="small">批准后提交给平台，冻结 <b class="num">${fmt(o.usdt)}</b> ${o.pay}。</p>`, otp: true, ok: '批准', run: () => { if (o.usdt > avail(o.pay)) { toast('可用余额不够，不能批准'); return; } setStatus(o, 'compliance'); o.mapprover = S.mUser; toast('已批准，已提交给平台'); } });
    },
    'm-reject': () => modal({ title: `驳回 ${o.id}`, input: '驳回原因（提交人会看到）', ok: '驳回', danger: true, run: () => { setStatus(o, 'rejected'); toast('已驳回，提交人会收到通知'); } }),
    'm-cancel': () => { setStatus(o, 'cancelled'); render(); toast('已作废'); },
    requote: () => { Object.assign(o, quoteFor(o.cur, o.amt, o.pay)); o.rate = o.rate * 0.9996; o.usdt = o.amt / o.rate + o.fee; o.quoteExp = Date.now() + 15 * MIN; render(); toast('已按最新汇率重新报价，有效 15 分钟'); },
    'bene-save': () => { S.benes.push({ id: 'B' + (S.benes.length + 1), name: (document.getElementById('bn-name') || {}).value || '新收款方', type: 'ent', cur: (document.getElementById('bn-cur') || {}).value || 'USD', acct: '待审核', country: '—', status: 'review', merchant: 'M-10086' }); go('m-benes'); toast('已提交，平台审核通过后可以付款'); },
    tdir: () => { S.transferDir = el.dataset.to; render(); },
    transfer: () => modal({ title: '确认余额互转', body: '<p class="small">实时到账，两边余额马上更新。</p>', otp: true, ok: '确认', run: () => toast('已转入，可以马上用来付款') }),
    'save-limit': () => { const v = parseFloat(document.getElementById('limit').value); if (!(v >= 0)) { toast('请输入 0 或更大的数字'); return; } modal({ title: '修改审批金额', body: `<p class="small">改为 <b class="num">${fmt(v, 0)}</b> USDT。</p>`, otp: true, ok: '保存', run: () => { S.limit = v; toast('已保存'); } }); },
    'bulk-load': () => { S.bulk = [['Lumen Trading FZE', '120,000.00 AED', '货款 INV-7750'], ['Fjord Components GmbH', '38,500.00 EUR', '配件'], ['Kestrel Logistics Ltd', '64,000.00 HKD', '物流费', '收款方还在审核中']]; render(); },
    // 运营
    'o-pass': () => { if (bene(o.bene).status !== 'ok') { toast('收款方还没审核通过，先到"收款方审核"处理'); return; } if (isCrypto(o)) { setStatus(o, 'payout_approval'); o.opMaker = S.oUser; } else setStatus(o, 'channel'); render(); toast(isCrypto(o) ? '已通过，直付按出款路线进入出款审批' : '已通过，等交易员选渠道'); },
    'o-info': () => modal({ title: '要求商户补资料', input: '要补什么（商户会看到）', ok: '发送', run: () => { setStatus(o, 'need_info'); toast('已通知商户补资料'); } }),
    'o-reject': () => modal({ title: `拒绝 ${o.id}`, input: '拒绝原因（内部记录）', ok: '拒绝并退回余额', danger: true, run: () => { setStatus(o, 'rejected'); toast('已拒绝，商户余额已解冻'); } }),
    'o-lock': () => { const sel = (document.querySelector('input[name=ch]:checked') || {}).value; if (!sel) return; o.channel = sel; o.opMaker = S.oUser; setStatus(o, 'payout_approval'); S.chSel = null; render(); toast(`已锁定 ${ch(sel).name} 的报价，等出款审批`); },
    'o-allfail': () => { setStatus(o, 'failed'); render(); toast('已改为失败，商户余额已恢复并通知商户'); },
    'o-approve': () => modal({ title: `批准出款 ${o.id}`, body: `<p class="small">从 ${ROUTES[o.pay] || '热钱包'} 转出 <b class="num">${fmt(o.usdt - o.fee)}</b> ${o.pay} 到${isCrypto(o) ? '收款方' : ' ' + ch(o.channel).name + ' '}的白名单地址。托管服务商会按自己的规则再审一次。</p>`, otp: true, ok: '批准出款', run: () => { o.opApprover = S.oUser; setStatus(o, 'signing'); toast('已批准，交给托管服务商签名'); } }),
    'o-back': () => { setStatus(o, 'channel'); render(); toast('已驳回给交易员'); },
    'sim-signed': () => { setStatus(o, isCrypto(o) ? 'done' : 'processing'); render(); toast(isCrypto(o) ? '已上链确认，付款完成' : '已上链转给渠道，渠道处理中'); },
    'sim-custody-reject': () => { setStatus(o, 'payout_approval'); render(); toast('托管服务商拒绝，已回到出款审批，同时进异常队列'); },
    'sim-ok': () => { setStatus(o, 'done'); S.posted[o.pay] -= o.usdt; render(); toast('渠道成功，付款完成，已正式扣款'); },
    'sim-fail': () => { o.tried.push(o.channel); const left2 = CHANNELS.filter(c => c.cur.includes(o.cur) && !o.tried.includes(c.id)); o.channel = null; setStatus(o, left2.length ? 'channel' : 'failed'); render(); toast(left2.length ? '渠道失败，钱已退回平台；回到"待选渠道"换一个渠道' : '所有渠道都失败，付款单失败，已恢复商户余额'); },
    'exc-done': () => { S.excDone[id] = true; render(); toast('已标记处理'); },
    'bene-pass': () => { const b = S.benes.find(x => x.id === id); b.status = 'ok'; b.acct = b.acct === '待审核' ? '已核对' : b.acct; render(); toast('已通过，商户现在可以向它付款'); },
    'mer-pass': () => { if (ou().role !== 'compliance') { toast('审核需要"合规审核"角色'); return; } const m = MERCHANTS.find(x => x.id === id); m.st = 'ok'; m.kyb = '已通过'; m.bal = '0'; render(); toast('已开通，结果已回传 Gateway'); },
    settle: () => { const s = S.settle.find(x => x.asset === el.dataset.asset); const net = s.g2p - s.p2g; modal({ title: `发起结算 · ${s.asset}`, body: `<p class="small">${net > 0 ? 'Gateway 向 Payment' : 'Payment 向 Gateway'} 转 <b class="num">${fmt(Math.abs(net))}</b> ${s.asset}。发起前会再核对一次两边清算账户。</p>`, otp: true, ok: '发起', run: () => { S.settleHist.unshift({ id: 'ST-00' + (43 + S.settleHist.length - 2), asset: s.asset, dir: net > 0 ? 'Gateway → Payment' : 'Payment → Gateway', amt: Math.abs(net), who: ou().name, at: '10-23 ' + new Date().toTimeString().slice(0, 5), st: '链上确认中' }); s.g2p = 0; s.p2g = 0; toast('已发起，等链上确认'); } }); },
    recon: () => toast('原型：已开始对账，几分钟后刷新结果'),
    close: () => { S.modal = null; renderOverlay(); },
    'close-bg': () => {},
    confirm: () => {
      const m = S.modal; if (!m) return;
      if (m.otp) { const v = Array.from({ length: 6 }, (_, i) => document.getElementById('otp' + i).value).join(''); if (!/^\d{6}$/.test(v)) { document.getElementById('otperr').textContent = '请输入 6 位数字'; return; } }
      S.modal = null; m.run && m.run(); render();
    },
  };
  (A[a] || A.noop)();
}
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('scrim')) { S.modal = null; renderOverlay(); return; }
  const t = e.target.closest('[data-act],[data-filter],[data-ofilter],tr[data-href]');
  if (!t) { if (e.target.closest('a[href="#"]')) e.preventDefault(); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.ofilter) { S.ofilter = t.dataset.ofilter; render(); return; }
  if (t.matches('tr[data-href]') && !e.target.closest('a,button')) { location.hash = t.dataset.href; return; }
  if (t.dataset.act) { e.preventDefault(); act(t.dataset.act, t); }
});
document.addEventListener('input', e => {
  const t = e.target; const d = S.draft;
  if (t.id && t.id.startsWith('otp') && t.value) { const n = document.getElementById('otp' + (+t.id.slice(3) + 1)); n && n.focus(); return; }
  if (!d) return;
  if (t.id === 'd-amt') { d.amt = t.value; refreshQuote(); }
  if (t.id === 'd-pur') d.purpose = t.value;
});
function refreshQuote() {
  // 只更新报价区域，输入框不重绘，避免丢焦点
  const pos = document.activeElement && document.activeElement.id; const sel = document.activeElement && document.activeElement.selectionStart;
  render(); const el = pos && document.getElementById(pos); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) {} }
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'muser') { S.mUser = t.value; render(); toast(`已切换为 ${MUSERS[t.value].name}（${MUSERS[t.value].label}）`); }
  if (t.id === 'ouser') { S.oUser = t.value; render(); toast(`已切换为 ${OUSERS[t.value].name}（${OUSERS[t.value].label}）`); }
  if (t.id === 'lang') { if (t.value === 'en') { t.value = 'zh'; toast('原型只做了中文；英文在开发阶段补齐（默认跟随浏览器语言）'); } }
  if (t.id === 'newm') { S.newMerchant = t.checked; if (t.checked) go('m-guide'); else render(); }
  if (t.id === 'd-bene') { draft().bene = t.value; const b = bene(t.value); if (b && b.type === 'wallet') draft().pay = b.acct.startsWith('TRON') ? 'USDT·TRON' : draft().pay; render(); }
  if (t.id === 'd-pay') { draft().pay = t.value; render(); }
  if (t.id === 'dep-asset') { S.depAsset = t.value; render(); }
  if (t.name === 'ch') { S.chSel = t.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; renderOverlay(); } if (e.key === 'Enter' && S.modal && e.target.closest('.modal') && e.target.tagName !== 'TEXTAREA') act('confirm', e.target); });

S.route = location.hash.slice(1) || 'start';
render();
})();
